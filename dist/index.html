<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Simple Minecraft DDoS</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #1e1e1e;
      color: #ddd;
      font-family: Segoe UI, Tahoma, sans-serif;
      font-size: 13px;
      padding: 16px;
    }
    .warning {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .layout {
      display: flex;
      gap: 20px;
    }
    .form {
      flex: 1;
      max-width: 260px;
    }
    .field {
      margin-bottom: 14px;
    }
    .field label {
      display: block;
      margin-bottom: 4px;
    }
    .field input, .field select {
      width: 100%;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #eee;
      padding: 6px 8px;
      border-radius: 2px;
    }
    .field input:focus, .field select:focus {
      border-color: #d7a13b;
      outline: none;
    }
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .buttons button {
      flex: 1;
      padding: 10px;
      background: #333;
      color: #eee;
      border: 1px solid #555;
      border-radius: 2px;
      cursor: pointer;
    }
    .buttons button:hover {
      background: #3f3f3f;
    }
    #logs-panel {
      flex: 1;
      background: #2a2a2a;
      border-radius: 4px;
      padding: 10px;
      overflow-y: auto;
      height: 420px;
    }
    #logs-panel label {
      display: block;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>
  <div class="warning">Well don't even think about using this on any server, you will get banned</div>

  <div class="layout">
    <div class="form">
      <div class="field">
        <label>Version:</label>
        <select id="minecraft-version"></select>
      </div>
      <div class="field">
        <label>Server IP:</label>
        <input id="server-ip" type="text" value="localhost" />
      </div>
      <div class="field">
        <label>Server Port:</label>
        <input id="server-port" type="text" value="25565" />
      </div>
      <div class="field">
        <label>Total Bots:</label>
        <input id="total-bots" type="text" value="100" />
      </div>
      <div class="field">
        <label>Delay Each Bot:</label>
        <input id="delay-each-bot" type="text" value="0.5" />
      </div>

      <div class="buttons">
        <button id="start-button">Start</button>
        <button id="stop-button">Stop</button>
      </div>
      <div class="buttons">
        <button id="start-proxy-button">Start Proxy (Dev)</button>
      </div>
    </div>

    <div id="logs-panel">
      <div id="logs"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
